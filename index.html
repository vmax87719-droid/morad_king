<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MORAD STORE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#080406;--card:#1a0a10;--card2:#240d15;--red:#e11d2e;--red2:#ff2d55;
--gold:#ffcb5c;--txt:#fff6f7;--dim:#b18d93;--line:rgba(225,29,46,.30);--ok:#4ade80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--txt);
background:radial-gradient(120% 55% at 50% 0%,#300b14 0%,var(--bg) 55%,#040203 100%);
min-height:100vh;padding:16px 14px 96px}
.wrap{max-width:520px;margin:0 auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;
background:linear-gradient(145deg,var(--red2),var(--red));box-shadow:0 6px 20px rgba(225,29,46,.45)}
.bname{font-size:18px;font-weight:900;letter-spacing:.4px;
background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.bsub{font-size:11px;color:var(--dim);margin-top:2px}
.lang{border:1px solid var(--line);background:rgba(225,29,46,.14);color:var(--gold);
padding:9px 14px;border-radius:12px;font-size:12px;font-weight:800;cursor:pointer}
.bal{position:relative;overflow:hidden;border-radius:22px;padding:20px;margin-bottom:14px;
background:linear-gradient(135deg,#2d0b14 0%,#420e1a 45%,#19060b 100%);
border:1px solid var(--line);box-shadow:0 14px 36px rgba(0,0,0,.6)}
.bal:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;
background:radial-gradient(circle,rgba(255,45,85,.38),transparent 70%);top:-75px;left:-55px}
.blab{font-size:12px;color:var(--dim);letter-spacing:1px;position:relative}
.brow{display:flex;align-items:flex-end;gap:8px;margin-top:4px;position:relative}
.bnum{font-size:42px;font-weight:900;line-height:1;
background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.bunit{font-size:13px;color:var(--gold);font-weight:800;padding-bottom:5px}
.bst{display:flex;gap:8px;margin-top:16px;position:relative}
.bcell{flex:1;background:rgba(0,0,0,.28);border:1px solid rgba(255,203,92,.16);
border-radius:13px;padding:10px;text-align:center}
.bcell b{display:block;font-size:17px;font-weight:900;color:var(--gold)}
.bcell span{font-size:10px;color:var(--dim)}
.ref{border-radius:18px;padding:15px;margin-bottom:14px;background:var(--card);border:1px solid var(--line)}
.rtitle{font-size:12px;color:var(--dim);margin-bottom:9px}
.rrow{display:flex;gap:8px}
.rlink{flex:1;background:#0d0508;border:1px solid rgba(255,203,92,.22);border-radius:12px;
padding:12px;font-size:11px;color:var(--gold);overflow:hidden;text-overflow:ellipsis;
white-space:nowrap;font-family:ui-monospace,monospace}
.rbtn{border:none;border-radius:12px;padding:0 18px;font-size:12px;font-weight:900;cursor:pointer;
background:linear-gradient(145deg,var(--red2),var(--red));color:#fff}
.sect{display:flex;align-items:center;gap:10px;margin:0 0 13px}
.sect h2{font-size:15px;margin:0;font-weight:900}
.sect i{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.rebtn{border:1px solid var(--line);background:rgba(225,29,46,.13);color:var(--gold);
border-radius:10px;width:34px;height:34px;font-size:15px;cursor:pointer}
.p{border-radius:18px;padding:14px;margin-bottom:11px;
background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);
display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.pico{width:46px;height:46px;flex:0 0 46px;border-radius:14px;display:grid;place-items:center;font-size:20px;
background:linear-gradient(145deg,rgba(255,45,85,.22),rgba(225,29,46,.07));border:1px solid var(--line)}
.pinfo{flex:1;min-width:0}
.pname{font-size:14px;font-weight:800;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{display:flex;align-items:center;gap:7px;font-size:11px}
.price{color:var(--gold);font-weight:900;font-size:13px}
.free{color:var(--ok)}
.out{color:#ff7a8a}
.buy{border:none;border-radius:13px;padding:11px 17px;font-size:12px;font-weight:900;cursor:pointer;
background:linear-gradient(145deg,var(--red2),var(--red));color:#fff;white-space:nowrap}
.buy.off{background:#291118;color:#7b5761}
.ch{border-radius:18px;padding:14px;margin-bottom:10px;background:var(--card);
border:1px solid var(--line);display:flex;align-items:center;gap:12px;cursor:pointer}
.ch:active{border-color:var(--red2)}
.chico{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;font-size:19px;
background:linear-gradient(145deg,rgba(255,203,92,.18),rgba(225,29,46,.08));border:1px solid var(--line)}
.chtxt{flex:1;min-width:0}
.chname{font-size:13px;font-weight:800;margin-bottom:3px}
.chsub{font-size:10px;color:var(--dim)}
.chargo{color:var(--gold);font-size:15px;font-weight:900}
.acct{border-radius:18px;padding:16px;background:var(--card);border:1px solid var(--line);margin-bottom:12px}
.arow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;
border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.arow:last-child{border-bottom:none}
.arow span{color:var(--dim);font-size:12px}
.arow b{color:var(--gold)}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px 14px 16px;
background:linear-gradient(180deg,rgba(8,4,6,.2),rgba(8,4,6,.97) 40%);
backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:50}
.nbtn{flex:1;border:1px solid transparent;background:rgba(255,255,255,.04);color:var(--dim);
border-radius:14px;padding:10px 4px;font-size:10px;font-weight:800;cursor:pointer;
display:flex;flex-direction:column;align-items:center;gap:4px}
.nbtn i{font-size:18px;font-style:normal}
.nbtn.on{background:linear-gradient(145deg,rgba(255,45,85,.25),rgba(225,29,46,.1));
border-color:var(--line);color:#fff}
.note{text-align:center;font-size:11px;color:var(--dim);margin-top:20px;line-height:1.9}
.toast{position:fixed;bottom:96px;left:50%;transform:translate(-50%,90px);opacity:0;
background:linear-gradient(145deg,var(--red2),var(--red));color:#fff;padding:13px 22px;
border-radius:14px;font-size:12px;font-weight:800;transition:.28s;z-index:99;max-width:88%;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.warn{background:rgba(225,29,46,.13);border:1px solid var(--line);border-radius:14px;
padding:11px 13px;font-size:11px;color:#ffb3bd;margin-bottom:13px;line-height:1.7}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand">
      <div class="logo">🛒</div>
      <div>
        <div class="bname">MORAD STORE</div>
        <div class="bsub" id="sub">المتجر الرسمي</div>
      </div>
    </div>
    <button class="lang" id="langBtn">English</button>
  </div>

  <!-- الرئيسية -->
  <div id="tabHome">
    <div class="bal">
      <div class="blab" id="blab">رصيدك</div>
      <div class="brow"><div class="bnum" id="ptsH">0</div><div class="bunit" id="unitH">نقطة</div></div>
      <div class="bst">
        <div class="bcell"><b id="refsH">0</b><span id="lRefsH">إحالاتي</span></div>
        <div class="bcell"><b id="ordsH">0</b><span id="lOrdsH">مشترياتي</span></div>
        <div class="bcell"><b id="prodsH">0</b><span id="lProdsH">منتجات</span></div>
      </div>
    </div>

    <div class="ref">
      <div class="rtitle" id="rtitle">🔗 رابط الإحالة الخاص بك</div>
      <div class="rrow">
        <div class="rlink" id="rlink">—</div>
        <button class="rbtn" id="copyBtn">نسخ</button>
      </div>
    </div>

    <div class="sect"><h2 id="chTitle">القنوات</h2><i></i></div>
    <div class="ch" id="chOff">
      <div class="chico">📢</div>
      <div class="chtxt">
        <div class="chname" id="chOffN">مراد كينق</div>
        <div class="chsub" id="chOffS">القناة الرسمية</div>
      </div>
      <div class="chargo">›</div>
    </div>
    <div class="ch" id="chPrf">
      <div class="chico">🧾</div>
      <div class="chtxt">
        <div class="chname" id="chPrfN">قناة الإثباتات</div>
        <div class="chsub" id="chPrfS">إثباتات الشراء</div>
      </div>
      <div class="chargo">›</div>
    </div>

    <div class="note" id="note"></div>
  </div>

  <!-- المتجر -->
  <div id="tabStore" class="hide">
    <div id="warnBox" class="warn hide"></div>
    <div class="sect">
      <h2 id="ptitle">المنتجات</h2><i></i>
      <button class="rebtn" id="reBtn">⟳</button>
    </div>
    <div id="list"></div>
  </div>

  <!-- حسابي -->
  <div id="tabAcct" class="hide">
    <div class="bal">
      <div class="blab" id="blab2">رصيدك</div>
      <div class="brow"><div class="bnum" id="ptsA">0</div><div class="bunit" id="unitA">نقطة</div></div>
    </div>
    <div class="acct">
      <div class="arow"><span id="lUid">معرّفي</span><b id="uidV">—</b></div>
      <div class="arow"><span id="lRefs">إحالاتي</span><b id="refsA">0</b></div>
      <div class="arow"><span id="lOrds">مشترياتي</span><b id="ordsA">0</b></div>
      <div class="arow"><span id="lProds">المنتجات المتاحة</span><b id="prodsA">0</b></div>
      <div class="arow"><span id="lLang">اللغة</span><b id="langV">العربية</b></div>
    </div>
    <div class="ref">
      <div class="rtitle" id="rtitle2">🔗 رابط الإحالة الخاص بك</div>
      <div class="rrow">
        <div class="rlink" id="rlink2">—</div>
        <button class="rbtn" id="copyBtn2">نسخ</button>
      </div>
    </div>
  </div>
</div>

<div class="nav">
  <button class="nbtn on" id="navHome"><i>🏠</i><span id="navHomeT">الرئيسية</span></button>
  <button class="nbtn" id="navStore"><i>🛍️</i><span id="navStoreT">المتجر</span></button>
  <button class="nbtn" id="navAcct"><i>👤</i><span id="navAcctT">حسابي</span></button>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= الإعداد ================= */
var BOT="MORAD_king_storbot";
var CH_OFF="https://t.me/moradking11";
var CH_PRF="https://t.me/morad_botx";

var tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
if(tg){try{tg.ready();tg.expand();}catch(e){}}

/* البيانات تُقرأ من #hash أولاً — لا يُسقطها أي موقع — ثم من ?query */
var qh=new URLSearchParams((location.hash||"").replace(/^#/,""));
var qq=new URLSearchParams(location.search||"");
function P(k){var v=qh.get(k);if(v===null||v==="")v=qq.get(k);return v;}

var UID=P("u")||"";
if(UID==="None")UID="";
if(UID===""){try{if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.id)UID=String(tg.initDataUnsafe.user.id);}catch(e){}}
if(UID===""){try{UID=localStorage.getItem("ms_uid")||"";}catch(e){UID="";}}

var API=P("api")||"";
if(API===""){try{API=localStorage.getItem("ms_api")||"";}catch(e){API="";}}

var LANG=P("g")||localStorage.getItem("mstore_lang")||"ar";
if(LANG!=="en")LANG="ar";

var PTS=parseInt(P("p")||"0",10); if(isNaN(PTS))PTS=0;
var REFS=parseInt(P("r")||"0",10); if(isNaN(REFS))REFS=0;
var ORDS=0;

if(UID){try{localStorage.setItem("ms_uid",UID);}catch(e){}}
if(API){try{localStorage.setItem("ms_api",API);}catch(e){}}

/* منتجاتك الحقيقية — تظهر فوراً قبل الاتصال */
var PRODUCTS=[
  {n:1,name:"GRINGO-KEY",price:1,stock:true},
  {n:2,name:"AIM BOT NO BAN 🔥",price:1,stock:true},
  {n:3,name:"AIM BOT+ ESP 🔥",price:0,stock:true},
  {n:4,name:"FREE FIRE 2020",price:0,stock:true}
];

var T={
ar:{sub:"المتجر الرسمي",blab:"رصيدك",unit:"نقطة",rtitle:"🔗 رابط الإحالة الخاص بك",
copy:"نسخ",copied:"تم النسخ ✓",ptitle:"المنتجات",buy:"شراء",free:"مجاني",out:"نفد",pt:"نقطة",
lRefsH:"إحالاتي",lOrdsH:"مشترياتي",lProdsH:"منتجات",
lUid:"معرّفي",lRefs:"إحالاتي",lOrds:"مشترياتي",lProds:"المنتجات المتاحة",
lLang:"اللغة",langName:"العربية",navHome:"الرئيسية",navStore:"المتجر",navAcct:"حسابي",
chTitle:"القنوات",chOffN:"مراد كينق",chOffS:"القناة الرسمية",
chPrfN:"قناة الإثباتات",chPrfS:"إثباتات الشراء",
note:"الأسعار تُخصم من رصيدك في البوت تلقائياً<br>بعد الشراء يصلك المحتوى في تيليجرام",
opening:"جاري فتح البوت لإتمام الشراء...",noapi:"تعذّر التحديث — اضغط ⟳",
empty:"لا توجد منتجات الآن",lang:"English"},
en:{sub:"Official Store",blab:"Your balance",unit:"pts",rtitle:"🔗 Your referral link",
copy:"Copy",copied:"Copied ✓",ptitle:"Products",buy:"Buy",free:"FREE",out:"Sold out",pt:"pts",
lRefsH:"Referrals",lOrdsH:"Orders",lProdsH:"Products",
lUid:"My ID",lRefs:"Referrals",lOrds:"Orders",lProds:"Available",
lLang:"Language",langName:"English",navHome:"Home",navStore:"Store",navAcct:"Account",
chTitle:"Channels",chOffN:"Morad King",chOffS:"Official channel",
chPrfN:"Proofs Channel",chPrfS:"Purchase proofs",
note:"Prices are deducted from your bot balance<br>Content arrives in Telegram after purchase",
opening:"Opening the bot to complete your order...",noapi:"Could not refresh — tap ⟳",
empty:"No products right now",lang:"عربي"}
};

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function toast(m){var e=$("toast");e.textContent=m;e.classList.add("on");setTimeout(function(){e.classList.remove("on");},2300);}
function refLink(){return "https://t.me/"+BOT+"?start=ref_"+(UID||"");}

function render(){
  var t=T[LANG];
  document.documentElement.lang=LANG;
  document.documentElement.dir=(LANG==="ar")?"rtl":"ltr";
  $("sub").textContent=t.sub;
  $("blab").textContent=t.blab; $("blab2").textContent=t.blab;
  $("unitH").textContent=t.unit; $("unitA").textContent=t.unit;
  $("rtitle").textContent=t.rtitle; $("rtitle2").textContent=t.rtitle;
  $("copyBtn").textContent=t.copy; $("copyBtn2").textContent=t.copy;
  $("ptitle").textContent=t.ptitle; $("note").innerHTML=t.note;
  $("langBtn").textContent=t.lang;
  $("chTitle").textContent=t.chTitle;
  $("chOffN").textContent=t.chOffN; $("chOffS").textContent=t.chOffS;
  $("chPrfN").textContent=t.chPrfN; $("chPrfS").textContent=t.chPrfS;
  $("lRefsH").textContent=t.lRefsH; $("lOrdsH").textContent=t.lOrdsH; $("lProdsH").textContent=t.lProdsH;
  $("lUid").textContent=t.lUid; $("lRefs").textContent=t.lRefs;
  $("lOrds").textContent=t.lOrds; $("lProds").textContent=t.lProds;
  $("lLang").textContent=t.lLang; $("langV").textContent=t.langName;
  $("navHomeT").textContent=t.navHome; $("navStoreT").textContent=t.navStore; $("navAcctT").textContent=t.navAcct;
  $("ptsH").textContent=PTS; $("ptsA").textContent=PTS;
  $("refsH").textContent=REFS; $("refsA").textContent=REFS;
  $("ordsH").textContent=ORDS; $("ordsA").textContent=ORDS;
  $("prodsH").textContent=PRODUCTS.length; $("prodsA").textContent=PRODUCTS.length;
  $("uidV").textContent=UID||"—";
  $("rlink").textContent=refLink(); $("rlink2").textContent=refLink();

  var box=$("list"); box.innerHTML="";
  if(!PRODUCTS.length){
    box.innerHTML='<div class="p"><div class="pinfo"><div class="pname">'+t.empty+'</div></div></div>';
    return;
  }
  PRODUCTS.forEach(function(p){
    var row=document.createElement("div"); row.className="p";
    var priceTxt=p.price>0?'<span class="price">'+p.price+' '+t.pt+'</span>':'<span class="price free">'+t.free+'</span>';
    var stockTxt=p.stock?"":' <span class="out">• '+t.out+'</span>';
    row.innerHTML='<div class="pico">📦</div><div class="pinfo"><div class="pname">'+esc(p.name)+'</div>'+
      '<div class="pmeta">'+priceTxt+stockTxt+'</div></div>'+
      '<button class="buy'+(p.stock?"":" off")+'">'+(p.stock?t.buy:t.out)+'</button>';
    row.querySelector(".buy").addEventListener("click",function(){
      if(!p.stock){toast(t.out);return;}
      buy(p.n);
    });
    box.appendChild(row);
  });
}

function showTab(w){
  var m={home:"tabHome",store:"tabStore",acct:"tabAcct"};
  var n={home:"navHome",store:"navStore",acct:"navAcct"};
  for(var k in m){$(m[k]).classList.toggle("hide",k!==w);$(n[k]).classList.toggle("on",k===w);}
  window.scrollTo(0,0);
}
$("navHome").addEventListener("click",function(){showTab("home");});
$("navStore").addEventListener("click",function(){showTab("store");});
$("navAcct").addEventListener("click",function(){showTab("acct");});

/* ===== الشراء: رابط عميق يعمل من أي زر — لا يعتمد على sendData ===== */
function buy(id){
  toast(T[LANG].opening);
  var link="https://t.me/"+BOT+"?start=buy_"+id;
  setTimeout(function(){
    if(tg&&tg.openTelegramLink){try{tg.openTelegramLink(link);return;}catch(e){}}
    location.href=link;
  },700);
}

function openCh(url){
  if(tg&&tg.openTelegramLink){try{tg.openTelegramLink(url);return;}catch(e){}}
  window.open(url,"_blank");
}
$("chOff").addEventListener("click",function(){openCh(CH_OFF);});
$("chPrf").addEventListener("click",function(){openCh(CH_PRF);});

function copyRef(){
  var txt=refLink(),t=T[LANG];
  try{navigator.clipboard.writeText(txt);toast(t.copied);return;}catch(e){}
  var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");toast(t.copied);}catch(_){}
  document.body.removeChild(ta);
}
$("copyBtn").addEventListener("click",copyRef);
$("copyBtn2").addEventListener("click",copyRef);

$("langBtn").addEventListener("click",function(){
  LANG=(LANG==="ar")?"en":"ar";
  try{localStorage.setItem("mstore_lang",LANG);}catch(e){}
  render();
});

function applyData(d){
  if(!d) return false;
  var r=(d.result&&d.result.products)?d.result:d;
  var got=false;
  if(typeof r.points!=="undefined"){var v=parseInt(r.points,10);if(!isNaN(v)){PTS=v;got=true;}}
  if(typeof r.refs!=="undefined"){var v2=parseInt(r.refs,10);if(!isNaN(v2)){REFS=v2;got=true;}}
  if(typeof r.orders!=="undefined"){var v3=parseInt(r.orders,10);if(!isNaN(v3)){ORDS=v3;got=true;}}
  if(r.uid&&String(r.uid)!=="None"&&String(r.uid)!==""){
    UID=String(r.uid);try{localStorage.setItem("ms_uid",UID);}catch(e){}
  }
  if(r.products&&r.products.length){
    PRODUCTS=r.products.map(function(x){
      return {n:parseInt(x.n,10)||0,name:String(x.name||""),price:parseInt(x.price,10)||0,stock:!!x.stock};
    });
    got=true;
  }
  $("warnBox").classList.add("hide");
  render();
  return got;
}

function loadLive(showErr){
  if(!API){render();return;}
  fetch(API,{method:"GET",cache:"no-store"})
    .then(function(r){return r.json();})
    .then(function(d){applyData(d);})
    .catch(function(){
      render();
      var w=$("warnBox");w.textContent=T[LANG].noapi;w.classList.remove("hide");
      if(showErr)toast(T[LANG].noapi);
    });
}
$("reBtn").addEventListener("click",function(){loadLive(true);});

showTab("home");
render();
loadLive(false);
setInterval(function(){loadLive(false);},15000);
</script>
</body>
</html>
